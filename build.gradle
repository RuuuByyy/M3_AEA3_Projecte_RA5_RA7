plugins {
  id 'java'
  id 'application'
  id 'org.javamodularity.moduleplugin' version '1.8.12'
  id 'org.openjfx.javafxplugin' version '0.0.13'
  id 'org.beryx.jlink' version '2.25.0'
}

group 'Perez.Cordero'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' } //
  maven { url 'https://gitlab.com/api/v4/projects/56672451/packages/maven' }
}

ext {
  junitVersion = '5.9.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

application {
  mainModule = 'perez.cordero.projecte_ra5_ra7'
  mainClass = 'perez.cordero.projecte_ra5_ra7.app.MainApp'
}

javafx {
  version = '21.0.2'
  modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
  implementation 'com.github.aazbi:Llibreria_Fitxers:master-SNAPSHOT'

  implementation 'vicent.Bellver:missatges_i_alertes:4.0'

  // ZXing QR
  implementation 'com.google.zxing:core:3.5.3'
  implementation 'com.google.zxing:javase:3.5.3'

  // JUnit
  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
  useJUnitPlatform()
}

jlink {
  imageZip = project.file("${buildDir}/distributions/app-${javafx.platform.classifier}.zip")

  options = [
          '--strip-debug',
          '--compress', '2',
          '--no-header-files',
          '--no-man-pages'
  ]

  launcher {
    name = 'app'
  }
}

jlinkZip {
  group = 'distribution'
}